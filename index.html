function go(){const v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").focus();return}S.n=v;sv();rk("Bermain");map()}
function pb(){show(`<div class="c pop"><h2 class="wn">Ganti pemain?</h2><p>Progres pemain ini akan ditutup dan tidak bisa dilanjutkan lagi. Namanya tetap ada di Papan Peringkat.</p><button class="b" onclick="doPb()">Ya, pemain baru</button><button class="b g" onclick="menu()">Batal</button></div>`)}
function doPb(){S={n:"",xp:0,m:100,d:[0,0,0,0,0],s:{}};sv();setup()}
const open=i=>i==0||S.d[i-1];
function map(){const all=S.d.every(Boolean);show(hud()+`<div class="c"><h2>Peta Level</h2><p class="mu">Selesaikan level berurutan. Level yang selesai bisa dimainkan lagi sebagai latihan.</p></div><div class="g3">${L.map((l,i)=>`<button class="m ${S.d[i]?"d":""}" ${open(i)?"":"disabled"} onclick="brief(${i})"><span class="ic">${open(i)?l.i:"🔒"}</span><h3>${i+1}. ${l.n}</h3><span class="mu">${l.k} · ${l.t} detik/kartu</span><br><b class="${S.d[i]?"ok":"wn"}">${S.d[i]?"Selesai ✓ "+S.s[i].c+"/"+S.s[i].t+" · latihan":open(i)?"Siap dimainkan":"Terkunci"}</b></button>`).join("")}</div>${all?'<button class="b" onclick="rep()">Lihat laporan akhir</button>':""}`)}
function brief(i){show(hud()+`<div class="c pop"><span class="ic">${L[i].i}</span><h2>Level ${i+1}: ${L[i].n}</h2><p>${L[i].d}</p><p class="mu">6 kartu · ${L[i].t} detik per kartu${S.d[i]?" · mode latihan (nilai tidak berubah)":""}</p><button class="b" onclick="st(${i})">Mulai</button><button class="b g" onclick="map()">Kembali</button></div>`)}
const deck=i=>(i<4?sh(L[i].c):sh(L.slice(0,4).flatMap(l=>l.c))).slice(0,6);
function st(i){P={i:i,q:deck(i),r:0,c:0,x:0,cb:0,w:[],m:S.m,pr:!!S.d[i],e:0,act:0};nx()}
const mu=()=>Math.min(3,1+(P.cb/2|0)),gain=n=>{if(!P.pr)P.x+=n*mu()};
function nx(){if(P.r>=P.q.length)return end();P.e=0;P.act=1;P.left=L[P.i].t;const q=P.q[P.r];
show(hud(P.m,S.xp+P.x)+`<div class="c" style="padding:12px"><div class="hud"><span>Kartu ${P.r+1}/${P.q.length}</span><span class="wn">🔥 x${mu()}</span></div><div class="mt"><i id="tb" style="width:100%"></i></div><div class="card" id="cd"><b>${q[0]} ${E(q[1])}</b><p>${E(q[2])}</p><div class="ev" id="dt" hidden>🔍 ${E(q[3])}</div></div><div class="row"><button class="b r" onclick="ans(0)">⬅ Bahaya</button><button class="b g" onclick="insp()">🔍 Periksa</button><button class="b k" onclick="ans(1)">Aman ➡</button></div></div>`);
const cd=document.getElementById("cd");let x0=null;
cd.onpointerdown=e=>{x0=e.clientX;cd.setPointerCapture(e.pointerId)};
cd.onpointermove=e=>{if(x0!=null){const d=e.clientX-x0;cd.style.transform=`translateX(${d}px) rotate(${d/18}deg)`;cd.style.borderColor=d>0?"var(--ok)":"var(--bad)"}};
cd.onpointerup=e=>{if(x0==null)return;const d=e.clientX-x0;x0=null;if(Math.abs(d)>90)ans(d>0?1:0);else{cd.style.transform="";cd.style.borderColor=""}};
clearInterval(TM);TM=setInterval(()=>{P.left-=.1;const b=document.getElementById("tb");if(b)b.style.width=Math.max(0,P.left/L[P.i].t*100)+"%";if(P.left<=0)tout()},100)}
function insp(){if(!P||!P.act)return;P.left=Math.max(.5,P.left-3);document.getElementById("dt").hidden=false}
document.onkeydown=e=>{if(P&&P.act){if(e.key=="ArrowLeft")ans(0);if(e.key=="ArrowRight")ans(1)}};
function lose(n,q){P.m=Math.max(0,P.m-n);P.cb=0;P.e=1;if(!P.w.includes(q))P.w.push(q)}
function fb(ok,msg,q){clearInterval(TM);P.act=0;if(ok){show(hud(P.m,S.xp+P.x)+`<div class="c pop"><h2 class="ok">${msg}</h2></div>`);setTimeout(()=>{P.r++;nx()},800)}else if(P.m<=0)fail();else show(hud(P.m,S.xp+P.x)+`<div class="c pop"><h2 class="bad">${msg}</h2><p>${q[7]}</p><button class="b" onclick="P.r++;nx()">Lanjut</button></div>`)}
function ans(s){if(!P||!P.act)return;P.act=0;clearInterval(TM);const q=P.q[P.r],bad=q[4];
if(bad&&s==0){gain(50);show(hud(P.m,S.xp+P.x)+`<div class="c pop"><h2>🚫 Diblokir! Apa yang mencurigakan?</h2><p class="ev">${E(q[2])}</p>${q[5].map((o,k)=>`<button class="o" onclick="rs(${k})">${E(o)}</button>`).join("")}</div>`)}
else if(!bad&&s==1){gain(50);P.cb++;if(!P.e)P.c++;fb(1,"✅ Aman! +"+50*mu()+" XP",q)}
else if(bad){lose(20,q);fb(0,"💥 Kartu berbahaya lolos! Meter -20",q)}
else{lose(10,q);fb(0,"⚠️ Itu sebenarnya aman. Meter -10",q)}}
function rs(k){const q=P.q[P.r];if(k==q[6]){gain(50);P.cb++;if(!P.e)P.c++;fb(1,"✅ Tepat! +"+100*mu()+" XP",q)}else{lose(5,q);fb(0,"🤔 Alasannya kurang tepat. Meter -5",q)}}
function tout(){if(!P||!P.act)return;const q=P.q[P.r];lose(q[4]?20:10,q);fb(0,"⏰ Waktu habis! Meter -"+(q[4]?20:10),q)}
function fail(){clearInterval(TM);P.act=0;if(!P.pr){S.m=60;sv()}show(hud(0,S.xp)+`<div class="c pop"><h2 class="bad">Meter habis!</h2><p>Terlalu banyak ancaman lolos. Evaluasi ulang: ulangi level ini dengan lebih teliti.</p><button class="b" onclick="st(${P.i})">Ulangi level</button><button class="b g" onclick="map()">Peta</button></div>`)}
function end(){clearInterval(TM);const i=P.i,l=L[i],n=P.q.length;if(!P.pr){S.xp+=P.x;S.m=Math.min(100,P.m+10);S.d[i]=1;S.s[i]={c:P.c,t:n};sv();rk("Bermain")}
const all=S.d.every(Boolean)&&!P.pr;show(hud()+`<div class="c pop"><span class="ic">🏅</span><h2>Level selesai: ${l.n}</h2><p>Benar di percobaan pertama: <b>${P.c}/${n}</b><br>XP level ini: <b class="wn">+${P.x}</b>${P.pr?' <span class="mu">(latihan, nilai tidak berubah)</span>':""}</p>${P.w.length?`<h3 class="wn">Kartu yang perlu dipelajari</h3>${P.w.map(q=>`<p><b>${q[0]} ${E(q[2])}</b><br><span class="mu">${q[7]}</span></p>`).join("")}`:'<h3 class="ok">Sempurna, tanpa kesalahan!</h3>'}<button class="b" onclick="${all?"rep()":"map()"}">${all?"Lihat laporan akhir":"Kembali ke peta"}</button></div>`)}
function rep(){let c=0,t=0;L.forEach((l,i)=>{c+=S.s[i].c;t+=S.s[i].t});const p=Math.round(c/t*100),r=p>=85&&S.m>=70?["Cyber Guardian","🏆","ok","Hasil terbaik! Kamu penjaga gerbang sejati."]:p>=70&&S.m>=50?["Cyber Defender","🛡️","wn","Berhasil! Beberapa materi masih bisa diperkuat."]:["Training Required","📚","bad","Belum memenuhi kriteria. Pelajari materi merah, lalu berlatih di peta."];rk(r[0],p);
const v=L.map((l,i)=>Math.round(S.s[i].c/S.s[i].t*100)),lo=v.indexOf(Math.min(...v));
show(`<div class="c pop" style="text-align:center"><div style="font-size:58px">${r[1]}</div><h1 class="${r[2]}">${r[0]}</h1><p>${r[3]}</p><p>Nilai penguasaan <b>${p}%</b> · XP <b>${S.xp}</b> · Meter <b>${S.m}</b></p></div><div class="c"><h2>Penguasaan per materi</h2>${L.map((l,i)=>`<div>${l.i} ${l.k}: <b class="${v[i]>=70?"ok":"bad"}">${v[i]}%</b><div class="bar"><i style="width:${v[i]}%"></i></div></div>`).join("")}<p class="mu">Materi yang paling perlu diperkuat: <b>${L[lo].k}</b>. Latih di peta level.</p><button class="b" onclick="map()">Kembali ke peta</button><button class="b g" onclick="pb()">Pemain baru</button></div>${board()}`)}
menu();
</script></body></html>
